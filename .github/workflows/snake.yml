# ============================================================
# GitHub Action: Snake animation for profile README
# ------------------------------------------------------------
# CARA PAKAI (sekali saja):
# 1. Di repo Farerudesu/Farerudesu, buat file:
#      .github/workflows/snake.yml
#    lalu paste seluruh isi file ini ke sana.
# 2. Buka tab "Actions" di repo itu → pilih "Generate snake animation"
#    → "Run workflow" sekali secara manual.
# 3. Selesai. Ular akan update otomatis tiap 12 jam, dan README
#    sudah menunjuk ke file SVG-nya (section "Contribution Graph").
# ============================================================

name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # tiap 12 jam
  workflow_dispatch:          # tombol run manual

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
